<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dark Soul</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#ddd;
    font-family:'Cinzel',serif;
    overflow:hidden;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#08090b;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* TOP HUD */

.hud{
    position:absolute;
    top:22px;
    left:25px;
    width:330px;
}

.player-name{
    color:#ddd;
    font-size:14px;
    margin-bottom:7px;
    letter-spacing:2px;
    text-shadow:0 2px 4px #000;
}

.bar{
    height:17px;
    background:#171717;
    border:2px solid #777;
    margin-bottom:7px;
    box-shadow:0 2px 8px #000;
}

.bar-inner{
    height:100%;
    transition:width .15s;
}

.hp{
    background:linear-gradient(
        90deg,
        #5b0000,
        #bd1d1d,
        #e34242
    );
}

.stamina{
    background:linear-gradient(
        90deg,
        #536900,
        #a7c72c,
        #d5ec57
    );
}

.hud-label{
    position:absolute;
    font-size:10px;
    left:8px;
    margin-top:1px;
    color:#eee;
    text-shadow:0 1px 3px #000;
}

/* BOSS */

.boss-ui{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,80vw);
    text-align:center;
    display:none;
}

.boss-name{
    color:#d5b27a;
    font-size:18px;
    letter-spacing:4px;
    margin-bottom:8px;
    text-shadow:0 2px 6px #000;
}

.boss-bar{
    height:20px;
    border:2px solid #777;
    background:#111;
}

.boss-hp{
    height:100%;
    background:linear-gradient(
        90deg,
        #3d0505,
        #8f1111,
        #d52c2c
    );
}

/* SOULS */

.souls{
    position:absolute;
    right:30px;
    top:25px;
    color:#e8d59b;
    font-size:18px;
    text-shadow:0 2px 5px #000;
}

/* CENTER */

.center{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(3px);
    pointer-events:auto;
}

.center h1{
    font-size:65px;
    letter-spacing:12px;
    color:#c8c1b4;
    text-shadow:
        0 0 10px #000,
        0 4px 20px #000;
}

.center p{
    margin:15px 0 25px;
    color:#aaa;
}

button{
    font-family:'Cinzel',serif;
    color:#ddd;
    background:#151515;
    border:1px solid #777;
    padding:13px 35px;
    cursor:pointer;
    letter-spacing:2px;
    transition:.2s;
}

button:hover{
    background:#332d24;
    border-color:#c5a66b;
    color:#fff;
}

/* CONTROLS */

.controls{
    position:absolute;
    bottom:20px;
    right:25px;
    color:#777;
    font-size:11px;
    line-height:1.8;
    text-align:right;
}

.key{
    color:#bbb;
    border:1px solid #555;
    padding:2px 5px;
    margin:0 2px;
}

/* VIGNETTE */

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.5) 100%
        );
}

/* DAMAGE FLASH */

#damage{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.25);
    opacity:0;
    pointer-events:none;
}

/* MOBILE */

@media(max-width:700px){

    .hud{
        width:230px;
        left:12px;
        top:12px;
    }

    .souls{
        right:12px;
        top:15px;
        font-size:14px;
    }

    .center h1{
        font-size:35px;
        letter-spacing:6px;
    }

    .controls{
        display:none;
    }

}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div class="hud">

        <div class="player-name">
            ASHEN WARRIOR
        </div>

        <div class="bar">
            <span class="hud-label">HP</span>
            <div id="hp" class="bar-inner hp"></div>
        </div>

        <div class="bar">
            <span class="hud-label">STAMINA</span>
            <div id="stamina" class="bar-inner stamina"></div>
        </div>

    </div>

    <div class="souls">
        ☠ <span id="souls">0</span>
    </div>

    <div class="boss-ui" id="bossUI">

        <div class="boss-name">
            THE FALLEN KNIGHT
        </div>

        <div class="boss-bar">
            <div id="bossHP" class="boss-hp"></div>
        </div>

    </div>

    <div class="controls">
        <span class="key">W A S D</span> Move<br>
        <span class="key">SPACE</span> Roll<br>
        <span class="key">J</span> Attack<br>
        <span class="key">K</span> Heavy Attack<br>
        <span class="key">E</span> Heal
    </div>

    <div id="damage"></div>

    <div class="vignette"></div>

    <div class="center" id="menu">

        <h1>DARK SOUL</h1>

        <p>
            THE FLAME IS FADING...
        </p>

        <button onclick="startGame()">
            ENTER THE DARK
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W,H;

function resize(){

    W = canvas.width =
        window.innerWidth;

    H = canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   GAME
========================= */

let gameStarted = false;
let gameOver = false;
let victory = false;

let cameraX = 0;

let souls = 0;

const keys = {};

document.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if(
            e.key === " " ||
            e.key === "ArrowUp" ||
            e.key === "ArrowDown" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ){
            e.preventDefault();
        }

        if(
            e.key.toLowerCase() === "j"
        ){
            attack(false);
        }

        if(
            e.key.toLowerCase() === "k"
        ){
            attack(true);
        }

        if(
            e.key.toLowerCase() === "e"
        ){
            heal();
        }

    }
);

document.addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);


/* =========================
   PLAYER
========================= */

const player = {

    x:300,
    y:0,

    w:35,
    h:65,

    speed:3.5,

    hp:100,
    maxHp:100,

    stamina:100,
    maxStamina:100,

    souls:0,

    facing:1,

    attacking:false,
    attackTimer:0,

    rolling:false,
    rollTimer:0,

    invincible:0,

    hurtTimer:0
};


/* =========================
   WORLD
========================= */

const ground = 560;

const worldWidth = 4200;


/* =========================
   ENEMIES
========================= */

let enemies = [

    {
        x:700,
        y:0,
        w:42,
        h:62,
        hp:45,
        maxHp:45,
        speed:1.2,
        damage:12,
        type:"hollow",
        dead:false,
        attackCooldown:0
    },

    {
        x:1150,
        y:0,
        w:42,
        h:62,
        hp:50,
        maxHp:50,
        speed:1.3,
        damage:14,
        type:"hollow",
        dead:false,
        attackCooldown:0
    },

    {
        x:1700,
        y:0,
        w:45,
        h:65,
        hp:70,
        maxHp:70,
        speed:1,
        damage:17,
        type:"knight",
        dead:false,
        attackCooldown:0
    },

    {
        x:2250,
        y:0,
        w:45,
        h:65,
        hp:80,
        maxHp:80,
        speed:.9,
        damage:19,
        type:"knight",
        dead:false,
        attackCooldown:0
    }

];


/* Boss */

const boss = {

    x:3500,
    y:0,

    w:90,
    h:120,

    hp:500,
    maxHp:500,

    speed:1.3,

    damage:28,

    active:false,

    attackCooldown:0,

    attackTimer:0,

    dead:false

};


/* =========================
   PARTICLES
========================= */

let particles = [];

function particle(
    x,
    y,
    color,
    amount=10
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*6,

            vy:
                (Math.random()-.5)*6,

            life:1,

            size:
                Math.random()*5+2,

            color

        });

    }

}


/* =========================
   START
========================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display = "none";

    gameStarted = true;

    gameOver = false;

    victory = false;

    player.x = 300;

    player.hp = 100;

    player.stamina = 100;

    souls = 0;

    enemies.forEach(e => {

        e.dead = false;

        e.hp = e.maxHp;

    });

    boss.hp = boss.maxHp;

    boss.dead = false;

    document.getElementById(
        "bossUI"
    ).style.display = "none";

}


/* =========================
   UPDATE
========================= */

function update(){

    if(
        !gameStarted ||
        gameOver ||
        victory
    ) return;


    /* Player movement */

    let moving = false;

    if(keys["a"]){

        player.x -= player.speed;

        player.facing = -1;

        moving = true;

    }

    if(keys["d"]){

        player.x += player.speed;

        player.facing = 1;

        moving = true;

    }


    /* Roll */

    if(
        keys[" "] &&
        !player.rolling &&
        player.stamina >= 25
    ){

        player.rolling = true;

        player.rollTimer = 18;

        player.invincible = 25;

        player.stamina -= 25;

    }


    if(player.rolling){

        player.x +=
            player.facing * 7;

        player.rollTimer--;

        if(
            player.rollTimer <= 0
        ){

            player.rolling = false;

        }

    }


    /* Boundaries */

    player.x =
        Math.max(
            50,
            Math.min(
                worldWidth-100,
                player.x
            )
        );


    /* Stamina regeneration */

    if(
        !player.rolling &&
        !player.attacking
    ){

        player.stamina += .6;

    }

    player.stamina =
        Math.min(
            player.maxStamina,
            player.stamina
        );


    if(player.invincible > 0)
        player.invincible--;


    if(player.attackTimer > 0){

        player.attackTimer--;

        if(
            player.attackTimer === 0
        ){

            player.attacking = false;

        }

    }


    /* Enemies */

    enemies.forEach(enemy => {

        if(enemy.dead) return;

        enemy.attackCooldown--;

        const dx =
            player.x - enemy.x;

        const distance =
            Math.abs(dx);

        if(distance < 450){

            if(distance > 65){

                enemy.x +=
                    Math.sign(dx) *
                    enemy.speed;

            }

            else if(
                enemy.attackCooldown <= 0
            ){

                damagePlayer(
                    enemy.damage
                );

                enemy.attackCooldown =
                    90;

            }

        }

    });


    /* Boss */

    if(
        player.x > 3000 &&
        !boss.dead
    ){

        boss.active = true;

        document.getElementById(
            "bossUI"
        ).style.display = "block";

    }


    if(
        boss.active &&
        !boss.dead
    ){

        updateBoss();

    }


    /* Camera */

    cameraX =
        player.x -
        W*.35;

    cameraX =
        Math.max(
            0,
            Math.min(
                worldWidth-W,
                cameraX
            )
        );


    /* Particles */

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .15;

        p.life -= .025;

    });

    particles =
        particles.filter(
            p => p.life > 0
        );


    /* Victory */

    if(
        boss.dead &&
        player.x > 3900
    ){

        victory = true;

        showEnd(
            "VICTORY",
            "THE FLAME SURVIVES"
        );

    }

}


/* =========================
   BOSS
========================= */

function updateBoss(){

    const dx =
        player.x - boss.x;

    const distance =
        Math.abs(dx);

    boss.attackCooldown--;

    if(distance > 100){

        boss.x +=
            Math.sign(dx) *
            boss.speed;

    }

    else if(
        boss.attackCooldown <= 0
    ){

        damagePlayer(
            boss.damage
        );

        boss.attackCooldown =
            100;

        particle(
            boss.x,
            ground-boss.h/2,
            "#ff3b3b",
            15
        );

    }

}


/* =========================
   ATTACK
========================= */

function attack(heavy){

    if(
        !gameStarted ||
        gameOver ||
        victory ||
        player.attacking ||
        player.rolling
    ) return;


    const cost =
        heavy ? 35 : 15;

    if(
        player.stamina < cost
    ) return;

    player.stamina -= cost;

    player.attacking = true;

    player.attackTimer =
        heavy ? 28 : 18;

    const range =
        heavy ? 130 : 105;

    const damage =
        heavy ? 35 : 20;


    particle(
        player.x +
        player.facing*70,
        ground-65,
        "#e8d59b",
        heavy ? 15 : 7
    );


    /* Enemy hit */

    enemies.forEach(enemy => {

        if(enemy.dead) return;

        const dx =
            enemy.x - player.x;

        if(
            Math.abs(dx) < range &&
            Math.sign(dx) === player.facing
        ){

            enemy.hp -= damage;

            particle(
                enemy.x,
                ground-45,
                "#bd1d1d",
                15
            );

            if(
                enemy.hp <= 0
            ){

                enemy.dead = true;

                souls +=
                    enemy.type === "knight"
                    ? 100
                    : 50;

                particle(
                    enemy.x,
                    ground-40,
                    "#d8c28c",
                    25
                );

            }

        }

    });


    /* Boss hit */

    if(
        boss.active &&
        !boss.dead
    ){

        const dx =
            boss.x-player.x;

        if(
            Math.abs(dx) < range &&
            Math.sign(dx) === player.facing
        ){

            boss.hp -= damage;

            particle(
                boss.x,
                ground-70,
                "#ff3d3d",
                18
            );

            if(
                boss.hp <= 0
            ){

                boss.dead = true;

                boss.active = false;

                souls += 1000;

                document.getElementById(
                    "bossUI"
                ).style.display = "none";

                particle(
                    boss.x,
                    ground-70,
                    "#e5c46b",
                    80
                );

            }

        }

    }

}


/* =========================
   DAMAGE
========================= */

function damagePlayer(amount){

    if(
        player.invincible > 0 ||
        player.rolling ||
        player.hurtTimer > 0
    ) return;

    player.hp -= amount;

    player.hurtTimer = 30;

    document.getElementById(
        "damage"
    ).style.opacity = "1";

    setTimeout(() => {

        document.getElementById(
            "damage"
        ).style.opacity = "0";

    },100);

    particle(
        player.x,
        ground-40,
        "#d11",
        15
    );


    if(
        player.hp <= 0
    ){

        player.hp = 0;

        gameOver = true;

        showEnd(
            "YOU DIED",
            "THE FLAME HAS FADING..."
        );

    }

}


/* =========================
   HEAL
========================= */

function heal(){

    if(
        !gameStarted ||
        player.hp >= player.maxHp ||
        player.stamina < 10
    ) return;

    player.hp += 35;

    player.hp =
        Math.min(
            player.maxHp,
            player.hp
        );

    player.stamina -= 10;

    particle(
        player.x,
        ground-60,
        "#ffe477",
        25
    );

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* Sky */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#070a12"
    );

    sky.addColorStop(
        .55,
        "#12151a"
    );

    sky.addColorStop(
        1,
        "#050505"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();

    ctx.translate(
        -cameraX,
        0
    );


    drawMoon();

    drawMountains();

    drawGround();

    drawRuins();

    enemies.forEach(
        drawEnemy
    );

    if(
        boss.active &&
        !boss.dead
    ){

        drawBoss();

    }


    drawPlayer();

    drawParticles();

    ctx.restore();


    updateHUD();

}


/* =========================
   MOON
========================= */

function drawMoon(){

    const x =
        320;

    const y =
        110;

    const gradient =
        ctx.createRadialGradient(
            x,y,5,
            x,y,100
        );

    gradient.addColorStop(
        0,
        "rgba(220,220,200,.3)"
    );

    gradient.addColorStop(
        1,
        "rgba(220,220,200,0)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        x-100,
        y-100,
        200,
        200
    );

    ctx.fillStyle =
        "#c9c8b9";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        40,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   MOUNTAINS
========================= */

function drawMountains(){

    ctx.fillStyle =
        "#0c1015";

    ctx.beginPath();

    ctx.moveTo(
        cameraX,
        ground
    );

    for(
        let x=0;
        x<worldWidth;
        x+=250
    ){

        ctx.lineTo(
            x,
            ground -
            100 -
            Math.random()*120
        );

    }

    ctx.lineTo(
        worldWidth,
        ground
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================
   GROUND
========================= */

function drawGround(){

    ctx.fillStyle =
        "#11110f";

    ctx.fillRect(
        0,
        ground,
        worldWidth,
        H-ground
    );


    ctx.strokeStyle =
        "#35332d";

    ctx.lineWidth = 2;

    for(
        let x=0;
        x<worldWidth;
        x+=100
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            ground
        );

        ctx.lineTo(
            x+40,
            H
        );

        ctx.stroke();

    }

}


/* =========================
   RUINS
========================= */

function drawRuins(){

    for(
        let x=150;
        x<worldWidth;
        x+=380
    ){

        ctx.fillStyle =
            "#161819";

        ctx.fillRect(
            x,
            ground-150,
            70,
            150
        );

        ctx.fillRect(
            x+90,
            ground-90,
            45,
            90
        );


        ctx.fillStyle =
            "#242628";

        ctx.fillRect(
            x-10,
            ground-155,
            90,
            12
        );

    }

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

    const x =
        player.x;

    const y =
        ground-player.h;


    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.6)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground+4,
        30,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    if(player.rolling){

        ctx.fillStyle =
            "#24262a";

        ctx.beginPath();

        ctx.arc(
            x,
            y+30,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;

    }


    /* Cape */

    ctx.fillStyle =
        "#16181c";

    ctx.beginPath();

    ctx.moveTo(
        x-20,
        y+22
    );

    ctx.lineTo(
        x-34,
        y+65
    );

    ctx.lineTo(
        x+15,
        y+65
    );

    ctx.lineTo(
        x+18,
        y+20
    );

    ctx.closePath();

    ctx.fill();


    /* Body armor */

    ctx.fillStyle =
        "#34373b";

    ctx.fillRect(
        x-17,
        y+25,
        34,
        40
    );


    /* Head */

    ctx.fillStyle =
        "#45494d";

    ctx.beginPath();

    ctx.arc(
        x,
        y+17,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Helmet */

    ctx.fillStyle =
        "#24272a";

    ctx.beginPath();

    ctx.arc(
        x,
        y+14,
        17,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* Visor */

    ctx.fillStyle =
        "#080808";

    ctx.fillRect(
        x-13,
        y+13,
        26,
        6
    );


    /* Sword */

    ctx.save();

    ctx.translate(
        x,
        y+40
    );

    ctx.rotate(
        player.facing *
        -.35
    );

    ctx.fillStyle =
        "#b8b7ad";

    ctx.fillRect(
        15,
        -4,
        62,
        5
    );

    ctx.fillStyle =
        "#6b5634";

    ctx.fillRect(
        7,
        -8,
        10,
        14
    );

    ctx.restore();


    /* Attack slash */

    if(player.attacking){

        ctx.strokeStyle =
            "rgba(230,220,190,.9)";

        ctx.lineWidth = 5;

        ctx.shadowColor =
            "#fff";

        ctx.shadowBlur = 15;

        ctx.beginPath();

        ctx.arc(
            x,
            y+35,
            75,
            player.facing === 1
                ? -.8
                : Math.PI+.8,

            player.facing === 1
                ? .8
                : Math.PI-.8
        );

        ctx.stroke();

        ctx.shadowBlur = 0;

    }

}


/* =========================
   ENEMY
========================= */

function drawEnemy(enemy){

    if(enemy.dead) return;

    const x =
        enemy.x;

    const y =
        ground-enemy.h;


    /* Shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.7)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground+3,
        27,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Cloak */

    ctx.fillStyle =
        enemy.type === "knight"
        ? "#27282b"
        : "#1d1d1d";

    ctx.beginPath();

    ctx.moveTo(
        x-20,
        y+20
    );

    ctx.lineTo(
        x-30,
        ground
    );

    ctx.lineTo(
        x+28,
        ground
    );

    ctx.lineTo(
        x+18,
        y+20
    );

    ctx.closePath();

    ctx.fill();


    /* Head */

    ctx.fillStyle =
        "#393a3c";

    ctx.beginPath();

    ctx.arc(
        x,
        y+18,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Eyes */

    ctx.fillStyle =
        "#d32b2b";

    ctx.shadowColor =
        "#f00";

    ctx.shadowBlur = 10;

    ctx.fillRect(
        x-9,
        y+15,
        5,
        3
    );

    ctx.fillRect(
        x+4,
        y+15,
        5,
        3
    );

    ctx.shadowBlur = 0;


    /* Weapon */

    ctx.fillStyle =
        "#8b8b82";

    ctx.fillRect(
        x+10,
        y+30,
        45,
        4
    );


    /* HP */

    ctx.fillStyle =
        "#080808";

    ctx.fillRect(
        x-25,
        y-12,
        50,
        5
    );

    ctx.fillStyle =
        "#9d2020";

    ctx.fillRect(
        x-25,
        y-12,
        50 *
        (enemy.hp/enemy.maxHp),
        5
    );

}


/* =========================
   BOSS
========================= */

function drawBoss(){

    const x =
        boss.x;

    const y =
        ground-boss.h;


    /* Aura */

    const aura =
        ctx.createRadialGradient(
            x,
            y+60,
            10,
            x,
            y+60,
            140
        );

    aura.addColorStop(
        0,
        "rgba(130,0,0,.25)"
    );

    aura.addColorStop(
        1,
        "rgba(130,0,0,0)"
    );

    ctx.fillStyle = aura;

    ctx.fillRect(
        x-150,
        y-50,
        300,
        250
    );


    /* Body */

    ctx.fillStyle =
        "#202124";

    ctx.fillRect(
        x-38,
        y+30,
        76,
        90
    );


    /* Cape */

    ctx.fillStyle =
        "#090909";

    ctx.beginPath();

    ctx.moveTo(
        x-40,
        y+40
    );

    ctx.lineTo(
        x-80,
        ground
    );

    ctx.lineTo(
        x+75,
        ground
    );

    ctx.lineTo(
        x+38,
        y+40
    );

    ctx.closePath();

    ctx.fill();


    /* Helmet */

    ctx.fillStyle =
        "#383a3d";

    ctx.beginPath();

    ctx.arc(
        x,
        y+25,
        31,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Horns */

    ctx.fillStyle =
        "#1a1a1a";

    ctx.beginPath();

    ctx.moveTo(
        x-22,
        y+5
    );

    ctx.lineTo(
        x-50,
        y-35
    );

    ctx.lineTo(
        x-30,
        y+15
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x+22,
        y+5
    );

    ctx.lineTo(
        x+50,
        y-35
    );

    ctx.lineTo(
        x+30,
        y+15
    );

    ctx.fill();


    /* Eyes */

    ctx.fillStyle =
        "#e32b2b";

    ctx.shadowColor =
        "#ff0000";

    ctx.shadowBlur = 18;

    ctx.fillRect(
        x-18,
        y+20,
        10,
        5
    );

    ctx.fillRect(
        x+8,
        y+20,
        10,
        5
    );

    ctx.shadowBlur = 0;


    /* Great sword */

    ctx.save();

    ctx.translate(
        x,
        y+65
    );

    ctx.rotate(.25);

    ctx.fillStyle =
        "#aaa89f";

    ctx.fillRect(
        0,
        -6,
        115,
        12
    );

    ctx.fillStyle =
        "#6d4e2e";

    ctx.fillRect(
        -10,
        -11,
        25,
        22
    );

    ctx.restore();

}


/* =========================
   PARTICLES
========================= */

function drawParticles(){

    particles.forEach(p => {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.color;

        ctx.shadowColor =
            p.color;

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

}

function updateHUD(){

    document.getElementById(

    ).style.width =

    document.getElementById(
        "bossHP"
    ).style.width =
        Math.max(
            0,
            boss.hp /
            boss.maxHp *
            100
        ) + "%";

}
