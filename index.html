<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>F1 NIGHT RACE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@400;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 20%,#202b46,#070a12 60%);
    color:white;
    font-family:Prompt,sans-serif;
    overflow:hidden;
}

.game{
    width:min(1100px,100%);
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    padding:14px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 14px;
    z-index:5;
}

.logo{
    font-family:Orbitron;
    font-weight:900;
    font-size:clamp(1.5rem,4vw,2.5rem);
    font-style:italic;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 15px #e10600;
}

.logo span{
    color:#e10600;
}

.stats{
    display:flex;
    gap:8px;
}

.stat{
    min-width:90px;
    padding:7px 12px;
    border-radius:9px;
    background:rgba(15,23,42,.8);
    border:1px solid rgba(255,255,255,.1);
    text-align:center;
}

.stat small{
    display:block;
    color:#94a3b8;
    font-size:.6rem;
    letter-spacing:1px;
}

.stat strong{
    font-family:Orbitron;
    font-size:1rem;
}

/* TRACK */

.track-wrap{
    position:relative;
    flex:1;
    min-height:0;
    border-radius:20px;
    overflow:hidden;
    border:3px solid #252b3a;
    box-shadow:
        0 0 0 2px #111827,
        0 20px 70px rgba(0,0,0,.7);
}

canvas{
    width:100%;
    height:100%;
    display:block;
    background:#111;
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(3,6,14,.72);
    backdrop-filter:blur(7px);
    z-index:10;
}

.card{
    width:min(440px,90%);
    padding:38px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(145deg,#111827,#090d17);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 60px #000;
}

.card h1{
    font-family:Orbitron;
    font-size:2.3rem;
    color:#e10600;
    text-shadow:0 0 20px #e10600;
    margin-bottom:10px;
}

.card p{
    color:#94a3b8;
    margin-bottom:24px;
}

.btn{
    border:0;
    padding:13px 28px;
    border-radius:10px;
    background:linear-gradient(135deg,#e10600,#ff3b30);
    color:#fff;
    font-family:Prompt;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(225,6,0,.35);
}

.btn:hover{
    transform:translateY(-2px);
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    padding-top:12px;
}

.control{
    width:65px;
    height:48px;
    border-radius:10px;
    border:1px solid #334155;
    background:#111827;
    color:white;
    font-size:1.2rem;
}

.control:active{
    background:#e10600;
}

@media(max-width:600px){

    .game{
        padding:7px;
    }

    .header{
        padding:5px;
    }

    .stats{
        gap:4px;
    }

    .stat{
        min-width:62px;
        padding:5px;
    }

    .stat strong{
        font-size:.75rem;
    }

    .stat small{
        font-size:.48rem;
    }

    .controls{
        padding-top:7px;
    }

    .control{
        width:58px;
        height:45px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">

        <div class="logo">
            F1 <span>NIGHT RACE</span>
        </div>

        <div class="stats">

            <div class="stat">
                <small>SPEED</small>
                <strong id="speed">0</strong>
            </div>

            <div class="stat">
                <small>LAP</small>
                <strong id="lap">1 / 3</strong>
            </div>

            <div class="stat">
                <small>POSITION</small>
                <strong id="position">1st</strong>
            </div>

        </div>

    </div>

    <div class="track-wrap">

        <canvas id="game"></canvas>

        <div class="overlay" id="overlay">

            <div class="card">

                <h1 id="title">F1 NIGHT RACE</h1>

                <p id="message">
                    เตรียมตัวเข้าสู่สนามแข่ง
                </p>

                <button class="btn" id="start">
                    🏁 START RACE
                </button>

            </div>

        </div>

    </div>

    <div class="controls">

        <button class="control" id="left">◀</button>
        <button class="control" id="brake">▼</button>
        <button class="control" id="gas">▲</button>
        <button class="control" id="right">▶</button>

    </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const speedEl=document.getElementById("speed");
const lapEl=document.getElementById("lap");
const positionEl=document.getElementById("position");

const overlay=document.getElementById("overlay");
const title=document.getElementById("title");
const message=document.getElementById("message");
const startBtn=document.getElementById("start");

let W,H;

function resize(){

    W=canvas.width=canvas.clientWidth*devicePixelRatio;
    H=canvas.height=canvas.clientHeight*devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W=canvas.clientWidth;
    H=canvas.clientHeight;
}

window.addEventListener("resize",resize);
resize();


/* ================= GAME ================= */

let running=false;

let car={
    x:0,
    y:0,
    angle:0,
    speed:0,
    nitro:100
};

let opponents=[];

let keys={};

let roadOffset=0;
let distance=0;

const totalLaps=3;
let lap=1;

let lastTime=0;


/* ================= INPUT ================= */

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
    ].includes(e.key.toLowerCase()))
        e.preventDefault();
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


function hold(button,key){

    const el=document.getElementById(button);

    el.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    el.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    el.addEventListener("mousedown",()=>{
        keys[key]=true;
    });

    el.addEventListener("mouseup",()=>{
        keys[key]=false;
    });

    el.addEventListener("mouseleave",()=>{
        keys[key]=false;
    });
}

hold("left","arrowleft");
hold("right","arrowright");
hold("gas","arrowup");
hold("brake","arrowdown");


/* ================= START ================= */

startBtn.onclick=()=>{
    startRace();
};

function startRace(){

    running=true;

    overlay.style.display="none";

    car={
        x:W/2,
        y:H*.78,
        angle:0,
        speed:0,
        nitro:100
    };

    distance=0;
    lap=1;

    createOpponents();

    lastTime=performance.now();

    requestAnimationFrame(loop);
}


/* ================= OPPONENTS ================= */

function createOpponents(){

    opponents=[];

    const colors=[
        "#00d9ff",
        "#ffcc00",
        "#7c3aed",
        "#22c55e",
        "#f97316"
    ];

    for(let i=0;i<5;i++){

        opponents.push({
            x:W/2+(i-2)*45,
            y:H*.5-i*100,
            speed:2.5+Math.random()*1.8,
            color:colors[i],
            distance:Math.random()*500
        });
    }
}


/* ================= LOOP ================= */

function loop(time){

    if(!running)return;

    const dt=Math.min(
        (time-lastTime)/16.67,
        2
    );

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}


/* ================= UPDATE ================= */

function update(dt){

    const gas=
        keys["arrowup"] ||
        keys["w"];

    const brake=
        keys["arrowdown"] ||
        keys["s"];

    const left=
        keys["arrowleft"] ||
        keys["a"];

    const right=
        keys["arrowright"] ||
        keys["d"];

    if(gas)
        car.speed+=.12*dt;
    else
        car.speed-=.035*dt;

    if(brake)
        car.speed-=.18*dt;

    car.speed=Math.max(
        0,
        Math.min(8,car.speed)
    );


    /* Nitro */

    if(keys[" "] && car.nitro>0){

        car.speed+=.12*dt;
        car.nitro-=.5*dt;

    }else{

        car.nitro+=.12*dt;

    }

    car.nitro=Math.max(
        0,
        Math.min(100,car.nitro)
    );


    /* Steering */

    if(left)
        car.x-=3.2*dt*(.5+car.speed/8);

    if(right)
        car.x+=3.2*dt*(.5+car.speed/8);


    /* Track boundaries */

    const trackLeft=W*.25;
    const trackRight=W*.75;

    car.x=Math.max(
        trackLeft+25,
        Math.min(
            trackRight-25,
            car.x
        )
    );


    roadOffset+=car.speed*dt;

    distance+=car.speed*dt;

    if(distance>1200){

        distance=0;
        lap++;

        if(lap>totalLaps){

            finishRace();
            return;
        }
    }


    /* AI */

    opponents.forEach(o=>{

        o.y+=(
            car.speed-o.speed
        )*dt;

        o.y+=
            car.speed*.7*dt;

        if(o.y>H+100){

            o.y=-100;
            o.x=
                W*.35+
                Math.random()*
                W*.3;

        }

    });


    /* Collision */

    opponents.forEach(o=>{

        if(
            Math.abs(car.x-o.x)<28 &&
            Math.abs(car.y-o.y)<50
        ){

            car.speed*=.55;

        }

    });


    /* Position */

    let position=1;

    opponents.forEach(o=>{
        if(o.y>car.y)
            position++;
    });

    positionEl.textContent=
        position+
        (position===1?"st":
         position===2?"nd":
         position===3?"rd":"th");

    speedEl.textContent=
        Math.round(car.speed*38);

    lapEl.textContent=
        `${lap} / ${totalLaps}`;
}


/* ================= DRAW ================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    drawSky();
    drawTrack();
    drawCars();
    drawHUD();

}


/* SKY */

function drawSky(){

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#020617"
    );

    gradient.addColorStop(
        .45,
        "#111827"
    );

    gradient.addColorStop(
        1,
        "#020617"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* Moon */

    ctx.beginPath();

    ctx.arc(
        W*.82,
        H*.15,
        45,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#e2e8f0";
    ctx.shadowColor="#fff";
    ctx.shadowBlur=30;

    ctx.fill();

    ctx.shadowBlur=0;


    /* Stars */

    for(let i=0;i<80;i++){

        const x=(i*83)%W;
        const y=(i*47)%(H*.45);

        ctx.fillStyle=
            "rgba(255,255,255,.5)";

        ctx.fillRect(
            x,y,1,1
        );
    }

}


/* TRACK */

function drawTrack(){

    const center=W/2;

    const left=W*.25;
    const right=W*.75;

    /* Grass */

    ctx.fillStyle="#17251b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Road */

    ctx.fillStyle="#252a32";

    ctx.beginPath();

    ctx.moveTo(
        center-W*.25,
        0
    );

    ctx.lineTo(
        center+W*.25,
        0
    );

    ctx.lineTo(
        center+W*.25,
        H
    );

    ctx.lineTo(
        center-W*.25,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* Road edges */

    ctx.fillStyle="#e10600";

    ctx.fillRect(
        left-8,
        0,
        8,
        H
    );

    ctx.fillRect(
        right,
        0,
        8,
        H
    );


    /* Kerbs */

    for(
        let y=-60+(roadOffset%60);
        y<H;
        y+=60
    ){

        ctx.fillStyle=
            ((Math.floor(y/60)%2)===0)
            ? "#fff"
            : "#e10600";

        ctx.fillRect(
            left-22,
            y,
            14,
            30
        );

        ctx.fillRect(
            right+8,
            y,
            14,
            30
        );
    }


    /* Center lines */

    ctx.setLineDash([
        45,
        35
    ]);

    ctx.lineDashOffset=
        -roadOffset*2;

    ctx.strokeStyle=
        "rgba(255,255,255,.15)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(center,0);
    ctx.lineTo(center,H);

    ctx.stroke();

    ctx.setLineDash([]);


    /* Start finish */

    const finishY=
        ((H*.2+roadOffset*2)%H);

    for(let x=left;x<right;x+=40){

        const even=
            Math.floor(x/40)%2===0;

        ctx.fillStyle=
            even?"#fff":"#111";

        ctx.fillRect(
            x,
            finishY,
            40,
            20
        );
    }

}


/* ================= CARS ================= */

function drawCars(){

    opponents.forEach(o=>{
        drawCar(
            o.x,
            o.y,
            o.color,
            false
        );
    });


    drawCar(
        car.x,
        car.y,
        "#e10600",
        true
    );

}


/* CAR */

function drawCar(
    x,
    y,
    color,
    player
){

    ctx.save();

    ctx.translate(x,y);

    /* Shadow */

    ctx.fillStyle="rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        24,
        42,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Glow */

    if(player){

        ctx.shadowColor=color;
        ctx.shadowBlur=20;
    }


    /* Body */

    ctx.fillStyle=color;

    roundRect(
        ctx,
        -15,
        -36,
        30,
        72,
        8
    );

    ctx.fill();


    /* Nose */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.moveTo(-9,-36);
    ctx.lineTo(9,-36);
    ctx.lineTo(5,-49);
    ctx.lineTo(-5,-49);

    ctx.closePath();

    ctx.fill();


    /* Cockpit */

    ctx.fillStyle="#020617";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -7,
        8,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Driver */

    ctx.fillStyle="#111827";

    ctx.beginPath();

    ctx.arc(
        0,
        -10,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Front wing */

    ctx.fillStyle="#111827";

    ctx.fillRect(
        -22,
        -47,
        44,
        5
    );


    /* Rear wing */

    ctx.fillRect(
        -19,
        34,
        38,
        5
    );


    /* Wheels */

    ctx.fillStyle="#050505";

    ctx.fillRect(
        -20,
        -25,
        7,
        18
    );

    ctx.fillRect(
        13,
        -25,
        7,
        18
    );

    ctx.fillRect(
        -20,
        15,
        7,
        18
    );

    ctx.fillRect(
        13,
        15,
        7,
        18
    );


    /* Lights */

    ctx.fillStyle=
        player?"#fff":"#ff3333";

    ctx.shadowColor=
        player?"#fff":"#ff0000";

    ctx.shadowBlur=8;

    ctx.fillRect(
        -4,
        -49,
        8,
        3
    );

    ctx.restore();

}


/* HUD */

function drawHUD(){

    /* Speed gauge */

    const x=65;
    const y=H-65;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        38,
        Math.PI,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.15)";

    ctx.lineWidth=6;

    ctx.stroke();


    const amount=
        car.speed/8;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        38,
        Math.PI,
        Math.PI+Math.PI*amount
    );

    ctx.strokeStyle="#e10600";
    ctx.lineWidth=6;

    ctx.stroke();


    ctx.fillStyle="#fff";

    ctx.font="bold 13px Orbitron";

    ctx.textAlign="center";

    ctx.fillText(
        "KM/H",
        x,
        y+20
    );


    /* Nitro */

    const barW=150;
    const barH=8;

    const bx=W-barW-25;
    const by=H-35;

    ctx.fillStyle=
        "rgba(255,255,255,.12)";

    ctx.fillRect(
        bx,
        by,
        barW,
        barH
    );

    ctx.fillStyle="#00d9ff";

    ctx.fillRect(
        bx,
        by,
        barW*(car.nitro/100),
        barH
    );

    ctx.font="10px Prompt";
    ctx.textAlign="right";
    ctx.fillStyle="#94a3b8";

    ctx.fillText(
        "NITRO [SPACE]",
        bx+barW,
        by-7
    );

}


/* ROUND RECT */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.arcTo(
        x+w,
        y,
        x+w,
        y+h,
        r
    );

    ctx.arcTo(
        x+w,
        y+h,
        x,
        y+h,
        r
    );

    ctx.arcTo(
        x,
        y+h,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x+w,
        y,
        r
    );

    ctx.closePath();
}


/* ================= FINISH ================= */

function finishRace(){

    running=false;

    title.textContent="🏆 FINISH";

    message.textContent=
        "การแข่งขันจบลงแล้ว!";

    startBtn.textContent=
        "↻ RACE AGAIN";

    overlay.style.display="flex";

}


/* Initial screen */

resize();

</script>

</body>
</html>
